<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick 14 - Premium Web Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <style>
      /* Hide scrollbar for cleaner look */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Inter"', 'sans-serif'],
              hand: ['"Caveat"', 'cursive'],
            },
            animation: {
                'infinite-scroll': 'scroll 40s linear infinite',
                'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            },
            keyframes: {
                scroll: {
                    '0%': { transform: 'translateX(0)' },
                    '100%': { transform: 'translateX(-50%)' },
                },
                fadeInUp: {
                    '0%': { opacity: '0', transform: 'translateY(20px)' },
                    '100%': { opacity: '1', transform: 'translateY(0)' },
                }
            },
            colors: {
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                300: '#d6d3d1',
                800: '#292524',
                900: '#1c1917',
              },
              orange: {
               50: '#f5f3ff',
  100: '#ede9fe',
  200: '#ddd6fe',
  300: '#c4b5fd',
  400: '#a78bfa',
  500: '#8b5cf6', // Primary Brand Color
  600: '#7c3aed',
  700: '#6d28d9',
              }
            },
          boxShadow: {
        // Updated to Amethyst/Purple Theme
        'tactile': '0 4px 0 0 #7c3aed, 0 8px 16px -4px rgba(124, 58, 237, 0.4)',
        'tactile-active': '0 2px 0 0 #7c3aed, 0 1px 4px -4px rgba(124, 58, 237, 0.4)',

        // Grays usually stay neutral, but I'll leave them as they were (Stone Gray)
        'tactile-gray': 'inset 0 -3px 0 0 #d6d3d1, 0 1px 2px 0 rgba(0, 0, 0, 0.05)',
        'tactile-gray-active': 'inset 0 -1px 0 0 #d6d3d1, 0 1px 1px 0 rgba(0, 0, 0, 0.05)',

        // Hero Button (Deep 3D effect)
        // Shadow: Purple-700 (#6d28d9)
        // Bottom Inset: Purple-400 (#a78bfa) - creates the 3D "lip"
        'hero': '0 1px 4px -4px #6d28d9, inset 0 -3px 0 0 #a78bfa, inset 0 3px 0 0 #ffffff40',
        'hero-active': '0 2px 4px -2px #6d28d9, inset 0 -1px 0 0 #a78bfa, inset 0 3px 0 0 #ffffff40',

        // Badge (Subtle depth for your "Post-SEO Era" pill)
        // Bottom Inset: Purple-200 (#a78bfa)
        'badge': 'inset 0 -3px 0 0 #a78bfa, 0 1px 2px 0 rgba(0, 0, 0, 0.05)',
        
        'canvas': '0 25px 50px -12px rgba(0, 0, 0, 0.15)',
      }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-white text-stone-900 antialiased overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
